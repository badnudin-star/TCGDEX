name: Android Validation

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/catalog-builder/requirements.txt

      - name: Install catalog-builder dependencies
        run: python -m pip install -r tools/catalog-builder/requirements.txt

      - name: Test catalog builder and artifact verifier
        run: python -m unittest discover -s tools/catalog-builder -p 'test_*.py' -v

      - name: Check Python syntax
        run: python -m py_compile tools/catalog-builder/build_catalog.py tools/catalog-builder/test_build_catalog.py tools/catalog-builder/verify_catalog_artifacts.py tools/verify_migration_16_17.py tools/check_migration_source.py tools/test_check_migration_source.py scripts/accessibility-check.py

      - name: Test production migration source guard
        run: python -m unittest tools.test_check_migration_source -v

      - name: Verify production Room migration source
        run: python tools/check_migration_source.py

      - name: Verify Room 16→17 migration SQL and schema offline
        run: python tools/verify_migration_16_17.py

      - name: Check Compose accessibility guardrails
        run: python scripts/accessibility-check.py

      - name: Check source wiring
        run: bash scripts/wiring-check.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Gradle wrapper
        run: ./gradlew --version

      - name: Run unit tests and build debug/release variants
        run: ./gradlew testDebugUnitTest assembleDebug assembleRelease

      - name: Verify Room schema export is committed and up to date
        run: |
          if ! git diff --exit-code -- app/schemas; then
            echo 'Room schema export differs from committed schema JSON. Review the generated schema and identityHash.' >&2
            exit 1
          fi
          if [ -n "$(git ls-files --others --exclude-standard -- app/schemas)" ]; then
            echo 'Room generated untracked schema files; review and commit them.' >&2
            git ls-files --others --exclude-standard -- app/schemas >&2
            exit 1
          fi

      - name: Run instrumented tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest

      - name: Verify R8 preserves Gson/Retrofit API model names
        run: ./scripts/verify-release-mapping.sh

      - name: Upload APKs, R8 mapping and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-validation-${{ github.run_number }}-${{ github.sha }}
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/mapping/release/mapping.txt
            app/build/reports/tests/testDebugUnitTest/**
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
          if-no-files-found: warn
          retention-days: 14
